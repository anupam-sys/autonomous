# Detection rules — gitleaks-compatible TOML subset.
# Fields: id, description, regex, keywords (prefilter), service, secret_type,
#         severity, confidence, entropy (optional floor), group (optional capture group index)

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
keywords = ["AKIA", "ASIA", "AIDA", "AROA", "AGPA", "A3T", "AIPA", "ANPA", "ANVA"]
service = "aws"
secret_type = "api_key"
severity = "high"
confidence = 0.9

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key assignment"
regex = '''(?i)aws.{0,20}?(?:secret|private).{0,10}?['"]([0-9a-zA-Z/+]{40})['"]'''
keywords = ["aws", "secret"]
service = "aws"
secret_type = "api_key"
severity = "critical"
confidence = 0.85
entropy = 4.5
group = 1

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
keywords = ["AIza"]
service = "google"
secret_type = "api_key"
severity = "high"
confidence = 0.9

[[rules]]
id = "gcp-service-account"
description = "GCP service account JSON"
regex = '''"type"\s*:\s*"service_account"'''
keywords = ["service_account"]
service = "gcp"
secret_type = "credential"
severity = "critical"
confidence = 0.95

