[[rules]]
id = "generic-api-key"
description = "Generic API key assignment"
regex = '''(?i)(?:api[_-]?key|apikey|api[_-]?secret|access[_-]?key|secret[_-]?key|client[_-]?secret|auth[_-]?token|access[_-]?token)\s*[:=]\s*['"]([A-Za-z0-9\-_/+.]{16,})['"]'''
keywords = ["api_key", "apikey", "api-key", "api_secret", "access_key", "secret_key", "client_secret", "auth_token", "access_token", "API_KEY", "APIKEY", "SECRET_KEY", "CLIENT_SECRET", "AUTH_TOKEN", "ACCESS_TOKEN", "ACCESS_KEY"]
service = "generic"
secret_type = "api_key"
severity = "medium"
confidence = 0.6
entropy = 3.8
group = 1

[[rules]]
id = "generic-password"
description = "Hardcoded password assignment"
regex = '''(?i)(?:password|passwd|pwd)\s*[:=]\s*['"]([^'"\s]{8,})['"]'''
keywords = ["password", "passwd", "pwd", "PASSWORD", "Password"]
service = "generic"
secret_type = "credential"
severity = "medium"
confidence = 0.5
entropy = 3.5
group = 1

[[rules]]
id = "http-api-endpoint"
description = "Cleartext HTTP API endpoint"
regex = '''http://[A-Za-z0-9.\-]+(?::[0-9]{2,5})?/(?:api|v[0-9]|graphql|rest|wp-json)[^\s'"<>]*'''
keywords = ["http://"]
service = "generic"
secret_type = "url"
severity = "low"
confidence = 0.4

[[rules]]
id = "ollama-interface-url"
description = "Exposed Ollama API interface endpoint"
regex = '''https?://[A-Za-z0-9.\-]+:11434(?:/[^\s'"<>]*)?'''
keywords = [":11434"]
service = "ollama"
secret_type = "url"
severity = "medium"
confidence = 0.85

[[rules]]
id = "kobold-interface-url"
description = "Exposed KoboldAI/KoboldCpp API interface endpoint"
regex = '''https?://[A-Za-z0-9.\-]+:500[0125](?:/[^\s'"<>]*)?'''
keywords = [":5000", ":5001", ":5002", ":5005"]
service = "kobold"
secret_type = "url"
severity = "medium"
confidence = 0.85
