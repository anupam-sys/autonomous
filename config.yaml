# ============================================================
# fully-autonomous — secret-exposure research pipeline
# ============================================================
# Everything tunable lives here. Secrets (tokens/api keys) can
# also come from environment variables (see .env.example).

paths:
  data_dir: "data"              # ephemeral work files (clones, apks, decompiled)
  db_path: "data/findings.db"
  report_dir: "reports"
  rules_dir: "src/detect/rules"

# --- resource knobs: defaults are for a SMALL VPS (2 vCPU/4GB).
# Raise these when you move to a bigger box. ---
limits:
  workers: 2                    # concurrent acquire/decompile jobs
  jadx_concurrency: 1           # concurrent jadx processes (RAM-hungry)
  max_apk_mb: 150               # skip APKs larger than this
  max_repo_mb: 300              # skip repos larger than this
  daily_bandwidth_mb: 5120      # stop downloading when exceeded
  work_retention: "on_finding"  # keep | on_finding | delete  (work files after scan)

# --- Stage 1: discovery ---
discovery:
  interval_minutes: 60          # how often discovery sources run
  firehose_enabled: true        # GitHub public events firehose (no token needed)
  gitlab_enabled: true
  bitbucket_enabled: false
  github_recent:
    enabled: true
    token: ""                   # drop a classic PAT here -> enables dork code-search
    per_page: 50
  registries:
    npm: true
    pypi: true
    docker_hub: false
  apk:
    fdroid: true
    apkmirror_recent: true
    apkpure_recent: false
    target_packages: []         # e.g. ["com.example.app"] — always fetched
  intelligence:
    enabled: true               # smart target evaluation & noise/spam filtering
    min_relevance_score: 0.25   # drop targets below this threshold (0.0 to 1.0)
    filter_spam: true           # filter bot-generated repos (repo-xxxxxx) & random hashes
    filter_forks: true          # skip forks (duplicate code, no new secrets)
    filter_noise_types: true    # skip leetcode, homework, wallpapers, icon packs, docs
    filter_system_apks: true    # skip OEM bloatware & system firmware APKs
    smart_git_filter: true      # blobless clone: skip files > max_file_kb during clone
    selective_extract: true     # package extraction: skip images, binaries, docs

# --- Stage 2/3 external tools (install via scripts/install_tools.py) ---
tools:
  jadx_path: "jadx"           # falls back to tools/jadx/bin/jadx(.bat)
  apktool_path: "apktool"     # optional; jadx alone is sufficient
  gitleaks_path: "gitleaks"   # falls back to tools/gitleaks(.exe)
  jadx_timeout_min: 15
  jadx_extra_args: []         # e.g. ["--deobf"]

# --- Stage 3: scanning ---
scan:
  interval_minutes: 5           # scheduler tick (discovery/report have their
                                # own interval gates; this drives acquire/scan)
  entropy_threshold: 4.5        # Shannon entropy floor for generic secrets
  min_secret_length: 8
  context_lines: 3              # lines of context stored with each finding
  max_file_kb: 2048             # skip files larger than this
  gitleaks_enabled: true        # git-history scan for cloned repos
  apk_decompile_mode: "on_hit"  # always | on_hit | never
                                # on_hit: byte-scan all APKs (fast), jadx only
                                # apps with hits (context). 10-30x throughput.

# --- LLM triage + AI-assisted discovery (any OpenAI-compatible API) ---
llm:
  enabled: false
  base_url: "https://api.openai.com/v1"   # point at ANY compatible endpoint
  api_key: ""                   # or LLM_API_KEY env var
  model: "gpt-4o-mini"
  timeout_seconds: 60
  triage_confidence_floor: 0.5  # only LLM-triage findings at/above this confidence
  max_findings_per_run: 100     # LLM cost cap per pipeline pass
  batch_size: 15                # findings triaged per request (saves API calls)
  ai_discovery:
    enabled: false
    allow_auto_dorks: false     # false = suggestions wait for approval in DB
    interval_hours: 24

# --- live transparency dashboard ---
web:
  enabled: true
  host: "127.0.0.1"           # set "0.0.0.0" on the VPS — but ONLY with a token
  port: 8080
  token: ""                   # empty = no auth (safe on localhost only!)

# --- reporting ---
report:
  interval_hours: 24
  reveal_secrets: true          # include FULL secret values in local JSON
                                # reports + dashboard/CLI reveal (your disclosure
                                # workflow needs them). Values are Fernet-encrypted
                                # at rest in the DB (data/secret.key). Set false
                                # to go back to preview-only everywhere.
  disclosure_lookup: true       # fetch security.txt contact for each org

log_level: "INFO"
