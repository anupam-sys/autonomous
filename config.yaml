# ============================================================
# fully-autonomous — secret-exposure research pipeline
# ============================================================
# Everything tunable lives here. Secrets (tokens/api keys) can
# also come from environment variables (see .env.example).

paths:
  data_dir: "data"              # ephemeral work files (clones, apks, decompiled)
  db_path: "data/findings.db"
  report_dir: "reports"
  rules_dir: "src/detect/rules"

# --- resource knobs: defaults are for a SMALL VPS (2 vCPU/4GB).
# Raise these when you move to a bigger box. ---
limits:
  workers: 8                    # fallback general concurrency
  acquire_workers: 16           # concurrent network clones & downloads
  scan_workers: 8               # concurrent filesystem & regex scans
  agent_workers: 4              # concurrent autonomous agent investigation threads
  discovery_workers: 8          # concurrent discovery source runners
  jadx_concurrency: 4           # concurrent jadx processes (RAM-hungry)
  max_apk_mb: 300               # skip APKs larger than this
  max_repo_mb: 500              # skip repos larger than this
  daily_bandwidth_mb: 51200     # stop downloading when exceeded
  work_retention: "on_finding"  # keep | on_finding | delete  (work files after scan)

# --- Stage 1: discovery ---
discovery:
  interval_minutes: 15          # how often discovery sources run
  firehose_enabled: true        # GitHub public events firehose (no token needed)
  gitlab_enabled: true
  bitbucket_enabled: true
  github_recent:
    enabled: true
    token: ""                   # drop a classic PAT here -> enables dork code-search
    per_page: 100
  registries:
    npm: true
    pypi: true
    docker_hub: true
  apk:
    fdroid: true
    apkmirror_recent: true
    apkpure_recent: true
    target_packages: []         # e.g. ["com.example.app"] — always fetched
  intelligence:
    enabled: true               # smart target evaluation & noise/spam filtering
    min_relevance_score: 0.25   # drop targets below this threshold (0.0 to 1.0)
    filter_spam: true           # filter bot-generated repos (repo-xxxxxx) & random hashes
    filter_forks: true          # skip forks (duplicate code, no new secrets)
    filter_noise_types: true    # skip leetcode, homework, wallpapers, icon packs, docs
    filter_system_apks: true    # skip OEM bloatware & system firmware APKs
    smart_git_filter: true      # blobless clone: skip files > max_file_kb during clone
    selective_extract: true     # package extraction: skip images, binaries, docs
  online_ports:
    enabled: false              # OFF by default. CAUTION: Outbound port scans to public IPs trigger VPS abuse filters!
    mode: "custom"              # custom (scan explicit hosts/subnets below) | ivre (local IVRE database) | internet (caution: requires host permission)
    interval_minutes: 60        # frequency of automated port discovery
    internet_sample_size: 50    # bounded sample size if internet mode is intentionally enabled
    subnets: []                 # explicit CIDRs you have authorization to scan
    hosts:                      # explicit targets (local lab, VPN, or owned servers)
      - "127.0.0.1"
      - "localhost"
      - "host.docker.internal"
    ports_ollama: [11434]       # default Ollama API ports
    ports_kobold: [5000, 5001, 5002] # default KoboldAI / KoboldCpp ports
    timeout: 2.0                # socket probe timeout (seconds)
    concurrency: 8              # conservative probe concurrency
    auto_use_for_triage: false  # auto-switch llm.base_url to fastest open Ollama/Kobold instance
    ivre_cli_path: "ivre"       # path to IVRE CLI if querying local IVRE recon database

# --- Stage 2/3 external tools (install via scripts/install_tools.py) ---
tools:
  jadx_path: "jadx"           # falls back to tools/jadx/bin/jadx(.bat)
  gitleaks_path: "gitleaks"   # falls back to tools/gitleaks(.exe)
  jadx_timeout_min: 15
  jadx_extra_args: []         # e.g. ["--deobf"]

# --- Stage 3: scanning ---
scan:
  interval_minutes: 2           # scheduler tick (discovery/report have their
                                # own interval gates; this drives acquire/scan)
  entropy_threshold: 4.5        # Shannon entropy floor for generic secrets
  min_secret_length: 8
  context_lines: 3              # lines of context stored with each finding
  max_file_kb: 2048             # skip files larger than this
  gitleaks_enabled: true        # git-history scan for cloned repos
  apk_decompile_mode: "on_hit"  # always | on_hit | never
                                # on_hit: byte-scan all APKs (fast), jadx only
                                # apps with hits (context). 10-30x throughput.

# --- LLM triage + AI-assisted discovery (any OpenAI-compatible API) ---
llm:
  enabled: false
  base_url: "https://api.openai.com/v1"   # point at ANY compatible endpoint
  api_key: ""                   # or LLM_API_KEY env var
  model: "gpt-4o-mini"
  timeout_seconds: 60
  triage_confidence_floor: 0.5  # only LLM-triage findings at/above this confidence
  max_findings_per_run: 500     # LLM cost cap per pipeline pass
  batch_size: 25                # findings triaged per request (saves API calls)
  request_token_budget: 0       # >0 = token-centered batching: fill each triage
                                # request to ~N est. tokens instead of counting items
                                # (batch_size still applies as a hard item cap)
  ai_discovery:
    enabled: false
    allow_auto_dorks: false     # false = suggestions wait for approval in DB
    interval_hours: 24

# --- Autonomous Agentic Triage & Safe Identity Probing ---
agent:
  enabled: true                 # autonomous deep context investigation
  active_probing: true          # safe non-destructive read-only identity verification
  exclude_localhost: true       # strictly exclude localhost/loopback
  max_turns: 4                  # maximum tool turns per investigation
  auto_investigate_high: true   # auto-run agent on high & critical findings
  min_confidence: 0.5           # minimum rule confidence for agent analysis
  findings_per_investigation: 1 # >1: one agent conversation investigates N findings
                                # (shared tool trace, per-finding verdicts) — big
                                # request saver when you're limited by requests/day

# --- live transparency dashboard ---
web:
  enabled: true
  host: "127.0.0.1"           # set "0.0.0.0" on the VPS — but ONLY with a token
  port: 8080
  token: ""                   # empty = no auth (safe on localhost only!)

# --- reporting ---
report:
  interval_hours: 24
  reveal_secrets: true          # include FULL secret values in local JSON
                                # reports + dashboard/CLI reveal (your disclosure
                                # workflow needs them). Values are Fernet-encrypted
                                # at rest in the DB (data/secret.key). Set false
                                # to go back to preview-only everywhere.
  disclosure_lookup: true       # fetch security.txt contact for each org

# --- notifications & interactive bot ---
notifications:
  discord:
    enabled: false              # set true to activate Discord alerts
    webhook_url: ""             # simple one-way webhook (optional)
    bot_token: ""               # Discord Bot token (for interactive threads, Q&A, and scanning)
    channel_id: null            # Discord Channel ID where finding alerts are posted
    authorized_users: []        # List of Discord user IDs allowed to run commands (empty = all in channel)
    notify_on: "true_positive"  # true_positive (only verified real secrets) | high_severity | any
    create_threads: true        # create interactive thread for each finding to chat/ask questions

log_level: "INFO"
